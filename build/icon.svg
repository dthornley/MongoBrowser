<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4fc26b"/>
      <stop offset="1" stop-color="#128a3c"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.05"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="14" flood-color="#000" flood-opacity="0.28"/>
    </filter>
    <filter id="inner" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#000" flood-opacity="0.22"/>
    </filter>
    <clipPath id="squircle">
      <rect x="100" y="100" width="824" height="824" rx="186" ry="186"/>
    </clipPath>
  </defs>

  <!-- macOS icon body -->
  <g filter="url(#shadow)">
    <rect x="100" y="100" width="824" height="824" rx="186" ry="186" fill="url(#bg)"/>
  </g>
  <!-- subtle top sheen -->
  <g clip-path="url(#squircle)">
    <ellipse cx="512" cy="150" rx="560" ry="300" fill="url(#glass)"/>
  </g>

  <!-- database cylinder -->
  <g filter="url(#inner)" fill="none" stroke="#ffffff" stroke-width="44" stroke-linecap="round">
    <!-- body -->
    <path d="M292 338 V640 C292 700 392 740 512 740 C632 740 732 700 732 640 V338"/>
    <!-- top ellipse -->
    <ellipse cx="512" cy="338" rx="220" ry="92"/>
    <!-- middle rings -->
    <path d="M292 440 C292 500 392 540 512 540 C632 540 732 500 732 440"/>
    <path d="M292 540 C292 600 392 640 512 640 C632 640 732 600 732 540"/>
  </g>

  <!-- magnifier -->
  <g filter="url(#inner)">
    <circle cx="672" cy="628" r="118" fill="#128a3c" stroke="#ffffff" stroke-width="40"/>
    <circle cx="672" cy="628" r="118" fill="none" stroke="#ffffff" stroke-width="40"/>
    <path d="M758 714 L846 802" stroke="#ffffff" stroke-width="56" stroke-linecap="round"/>
  </g>
</svg>
